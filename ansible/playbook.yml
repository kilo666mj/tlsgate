---
- name: Deploy tlsgate proxy
  hosts: tlsgate
  become: true
  serial: 1

  vars:
    goarch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: arm
    goarch: "{{ goarch_map[ansible_facts['architecture']] | default('amd64') }}"
    tlsgate_config_dir: /etc/tlsgate
    tlsgate_config: "{{ tlsgate_config_dir }}/config.json"

  tasks:
    - name: Ensure local token directory exists
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.file:
        path: "{{ playbook_dir }}/secrets"
        state: directory
        mode: "0700"

    - name: Register TLSGate node in Gatehub
      delegate_to: gatehub-control
      become: true
      no_log: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gatehub
          - register-node
          - --db
          - /var/lib/gatehub/gatehub.sqlite
          - --id
          - "{{ control_plane.instance_id }}"
          - --kind
          - tlsgate
          - --host
          - "{{ tlsgate_node_host }}"
          - --allowed-cert-name
          - "{{ tlsgate_node_host }}"
          - --token-file
          - "-"
        stdin: "{{ control_plane.token }}"
      when:
        - control_plane is defined
        - control_plane.url | default('') | length > 0
        - control_plane.token | default('') | length > 0
        - tlsgate_node_host is defined
      changed_when: true

    - name: Register additional TLSGate nodes in Gatehub
      delegate_to: gatehub-control
      become: true
      no_log: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/gatehub
          - register-node
          - --db
          - /var/lib/gatehub/gatehub.sqlite
          - --id
          - "{{ item.config_data.control_plane.instance_id }}"
          - --kind
          - tlsgate
          - --host
          - "{{ item.node_host }}"
          - --allowed-cert-name
          - "{{ item.allowed_cert_name }}"
          - --token-file
          - '-'
        stdin: "{{ item.config_data.control_plane.token }}"
      loop: "{{ tlsgate_extra_instances | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    # Describe the checkout so a deployed host reports what it is actually
    # running. Without this the binary keeps main.version's "dev" default, and
    # `tlsgate version` on the target tells you nothing about which build it has.
    - name: Describe the checkout for the version stamp
      delegate_to: localhost
      become: false
      command:
        cmd: git describe --tags --always --dirty
        chdir: "{{ playbook_dir }}/.."
      changed_when: false
      failed_when: false
      register: tlsgate_git_describe

    - name: Build binary for linux/{{ goarch }}
      delegate_to: localhost
      become: false
      command:
        cmd: >-
          go build -trimpath
          -ldflags "-s -w -X main.version={{ tlsgate_version }}"
          -o /tmp/tlsgate .
        chdir: "{{ playbook_dir }}/.."
      environment:
        CGO_ENABLED: "0"
        GOOS: linux
        GOARCH: "{{ goarch }}"
        GOTOOLCHAIN: go1.27.1
        GOCACHE: /tmp/tlsgate-go-cache
        GOMODCACHE: /tmp/tlsgate-go-mod-cache
      vars:
        tlsgate_version: "{{ tlsgate_git_describe.stdout | default('dev', true) | trim }}"
      changed_when: true

    - name: Create tlsgate system user
      user:
        name: tlsgate
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/tlsgate
        create_home: false

    - name: Create data directory
      file:
        path: /var/lib/tlsgate
        state: directory
        mode: '0750'
        owner: tlsgate
        group: tlsgate

    - name: Create config directory
      file:
        path: "{{ tlsgate_config_dir }}"
        state: directory
        mode: '0750'
        owner: root
        group: tlsgate

    - name: Create additional TLSGate data directories
      file:
        path: "{{ item.config_data.database | dirname }}"
        state: directory
        mode: '0750'
        owner: tlsgate
        group: tlsgate
      loop: "{{ tlsgate_extra_instances | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install gatehub server CA
      copy:
        src: "{{ control_plane_ca_src }}"
        dest: "{{ control_plane.ca }}"
        mode: '0640'
        owner: root
        group: tlsgate
      when:
        - control_plane is defined
        - control_plane.ca is defined
        - control_plane_ca_src is defined
      notify: Restart tlsgate

    - name: Deploy tlsgate config
      template:
        src: config.json.j2
        dest: "{{ tlsgate_config }}"
        mode: '0640'
        owner: root
        group: tlsgate
      notify: Restart tlsgate

    - name: Deploy additional TLSGate configs
      no_log: true
      copy:
        content: "{{ item.config_data | to_nice_json }}\n"
        dest: "{{ item.config }}"
        mode: '0640'
        owner: root
        group: tlsgate
      loop: "{{ tlsgate_extra_instances | default([]) }}"
      notify: Restart additional tlsgate instances

    - name: Copy binary
      copy:
        src: /tmp/tlsgate
        dest: /usr/local/bin/tlsgate
        mode: '0755'
      notify: Restart tlsgate

    - name: Deploy systemd service
      template:
        src: tlsgate.service.j2
        dest: /etc/systemd/system/tlsgate.service
        mode: '0644'
      notify:
        - Reload systemd
        - Restart tlsgate

    - name: Deploy additional TLSGate systemd services
      template:
        src: tlsgate.service.j2
        dest: "/etc/systemd/system/{{ item.name }}.service"
        mode: '0644'
      vars:
        tlsgate_config: "{{ item.config }}"
      loop: "{{ tlsgate_extra_instances | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      notify:
        - Reload systemd
        - Restart additional tlsgate instances

    # Apply listener removals to the primary process before an additional
    # instance attempts to bind its routes. Handlers run synchronously and in
    # declaration order, so the primary releases the socket first.
    - name: Apply TLSGate listener changes before starting instances
      ansible.builtin.meta: flush_handlers

    - name: Enable and start tlsgate
      systemd:
        name: tlsgate
        enabled: true
        state: started

    - name: Enable and start additional TLSGate instances
      systemd:
        name: "{{ item.name }}"
        enabled: true
        state: started
      loop: "{{ tlsgate_extra_instances | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create SMTP correlation output directory
      ansible.builtin.file:
        path: "{{ tlsgate_smtp_collector_output | default('/var/lib/tlsgate/correlation') }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: tlsgate_smtp_collector_enabled | default(false) | bool

    - name: Install SMTP correlation collector
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/mx-smtp-correlate.py"
        dest: /usr/local/libexec/mx-smtp-correlate.py
        owner: root
        group: root
        mode: '0755'
      when: tlsgate_smtp_collector_enabled | default(false) | bool

    - name: Remove legacy Gatehub collector override
      ansible.builtin.file:
        path: /etc/systemd/system/tlsgate-smtp-correlate.service.d/gatehub.conf
        state: absent
      when: tlsgate_smtp_collector_enabled | default(false) | bool
      notify:
        - Reload systemd
        - Restart SMTP correlation timer

    - name: Install SMTP correlation service
      ansible.builtin.template:
        src: tlsgate-smtp-correlate.service.j2
        dest: /etc/systemd/system/tlsgate-smtp-correlate.service
        owner: root
        group: root
        mode: '0644'
      when: tlsgate_smtp_collector_enabled | default(false) | bool
      notify:
        - Reload systemd
        - Restart SMTP correlation timer

    - name: Install SMTP correlation timer
      ansible.builtin.template:
        src: tlsgate-smtp-correlate.timer.j2
        dest: /etc/systemd/system/tlsgate-smtp-correlate.timer
        owner: root
        group: root
        mode: '0644'
      when: tlsgate_smtp_collector_enabled | default(false) | bool
      notify:
        - Reload systemd
        - Restart SMTP correlation timer

    - name: Install SMTP correlation log rotation
      ansible.builtin.template:
        src: tlsgate-smtp-correlation.logrotate.j2
        dest: /etc/logrotate.d/tlsgate-smtp-correlation
        owner: root
        group: root
        mode: '0644'
      when: tlsgate_smtp_collector_enabled | default(false) | bool

    - name: Install optional Rspamd TLSGate exporter
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../examples/{{ tlsgate_smtp_rspamd_exporter_source | default('rspamd-tlsgate.lua') }}"
        dest: "{{ tlsgate_smtp_rspamd_exporter_destination | default('/etc/rspamd/tlsgate.lua') }}"
        owner: "{{ tlsgate_smtp_rspamd_exporter_owner | default('root') }}"
        group: "{{ tlsgate_smtp_rspamd_exporter_group | default('root') }}"
        mode: '0644'
      when:
        - tlsgate_smtp_collector_enabled | default(false) | bool
        - tlsgate_smtp_rspamd_exporter_enabled | default(false) | bool

    - name: Apply SMTP collector unit changes
      ansible.builtin.meta: flush_handlers
      when: tlsgate_smtp_collector_enabled | default(false) | bool

    - name: Enable and start SMTP correlation timer
      ansible.builtin.systemd:
        name: tlsgate-smtp-correlate.timer
        enabled: true
        state: started
      when: tlsgate_smtp_collector_enabled | default(false) | bool

    - name: Check for a local Prometheus configuration
      ansible.builtin.stat:
        path: "{{ tlsgate_prometheus_config | default('/etc/prometheus/prometheus.yml') }}"
      register: tlsgate_prometheus_config_file

    - name: Check for an existing TLSGate scrape job
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -Eq
          - '^\s*-\s+job_name:\s+tlsgate\s*$'
          - "{{ tlsgate_prometheus_config | default('/etc/prometheus/prometheus.yml') }}"
      register: tlsgate_prometheus_existing_job
      changed_when: false
      failed_when: tlsgate_prometheus_existing_job.rc not in [0, 1]
      when:
        - tlsgate_configure_local_prometheus | default(true) | bool
        - metrics_listen | default('') | length > 0
        - tlsgate_prometheus_config_file.stat.exists

    - name: Normalize labels in an existing TLSGate scrape job
      ansible.builtin.lineinfile:
        path: "{{ tlsgate_prometheus_config | default('/etc/prometheus/prometheus.yml') }}"
        regexp: '^(\s*)tlsgate_instance:(.*)$'
        line: '\1gate_node:\2'
        backrefs: true
        backup: true
        validate: "/usr/bin/promtool check config --syntax-only %s"
      when:
        - tlsgate_configure_local_prometheus | default(true) | bool
        - metrics_listen | default('') | length > 0
        - tlsgate_prometheus_config_file.stat.exists
        - tlsgate_prometheus_existing_job.rc == 0
      notify: Reload prometheus

    - name: Configure local Prometheus to scrape TLSGate instances
      ansible.builtin.blockinfile:
        path: "{{ tlsgate_prometheus_config | default('/etc/prometheus/prometheus.yml') }}"
        marker: "# {mark} ANSIBLE MANAGED TLSGATE METRICS"
        block: |2
            - job_name: tlsgate
              static_configs:
                - targets:
                    - {{ metrics_listen | to_json }}
                  labels:
                    instance: {{ (inventory_hostname ~ '-tlsgate') | to_json }}
                    gate_node: {{ control_plane.instance_id | default(inventory_hostname) | to_json }}
          {% for item in tlsgate_extra_instances | default([]) %}
          {% if item.config_data.metrics_listen | default('') | length > 0 %}
                - targets:
                    - {{ item.config_data.metrics_listen | to_json }}
                  labels:
                    instance: {{ (inventory_hostname ~ '-tlsgate-' ~ item.name) | to_json }}
                    gate_node: {{ item.config_data.control_plane.instance_id | default(item.name) | to_json }}
          {% endif %}
          {% endfor %}
        # Validate YAML syntax before replacement. Full validation below uses
        # the installed path so existing relative rule and certificate paths
        # resolve against the correct directory.
        validate: "/usr/bin/promtool check config --syntax-only %s"
        backup: true
      when:
        - tlsgate_configure_local_prometheus | default(true) | bool
        - metrics_listen | default('') | length > 0
        - tlsgate_prometheus_config_file.stat.exists
        - tlsgate_prometheus_existing_job.rc == 1
      notify: Reload prometheus

    - name: Validate the installed Prometheus configuration
      ansible.builtin.command:
        argv:
          - /usr/bin/promtool
          - check
          - config
          - "{{ tlsgate_prometheus_config | default('/etc/prometheus/prometheus.yml') }}"
      changed_when: false
      when:
        - tlsgate_configure_local_prometheus | default(true) | bool
        - metrics_listen | default('') | length > 0
        - tlsgate_prometheus_config_file.stat.exists

    - name: Verify the primary TLSGate metrics endpoint
      ansible.builtin.uri:
        url: "http://{{ metrics_listen }}/metrics"
        return_content: true
        status_code: 200
      register: tlsgate_metrics_response
      failed_when: >-
        tlsgate_metrics_response.status != 200 or
        'tlsgate_connections_total' not in tlsgate_metrics_response.content
      when: metrics_listen | default('') | length > 0

    - name: Verify additional TLSGate metrics endpoints
      ansible.builtin.uri:
        url: "http://{{ item.config_data.metrics_listen }}/metrics"
        return_content: true
        status_code: 200
      register: tlsgate_extra_metrics_response
      failed_when: >-
        tlsgate_extra_metrics_response.status != 200 or
        'tlsgate_connections_total' not in tlsgate_extra_metrics_response.content
      loop: "{{ tlsgate_extra_instances | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.config_data.metrics_listen | default('') | length > 0

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Reload prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: reloaded

    # reload-or-restart performs a graceful upgrade when tlsgate is already
    # running: systemctl runs ExecReload (SIGHUP), tableflip re-execs the new
    # binary and hands off the listening sockets, and live IMAP and SMTP
    # sessions survive the deploy. It falls back to a start/restart when the
    # service is not running yet.
    #
    # NOTE: the first deploy of a tableflip-capable binary must still be a hard
    # restart. A pre-tableflip tlsgate treats SIGHUP as a clean stop and never
    # comes back, so reloading one is how a deploy takes mail down instead of
    # keeping it up. Once every host in the inventory is confirmed to be
    # running a tableflip build, this is safe.
    - name: Restart tlsgate
      ansible.builtin.command:
        cmd: "systemctl {{ 'restart' if hard_restart | default(false) | bool else 'reload-or-restart' }} tlsgate"
      changed_when: true

    - name: Restart additional tlsgate instances
      ansible.builtin.command:
        cmd: "systemctl reload-or-restart {{ item.name }}"
      loop: "{{ tlsgate_extra_instances | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: Restart SMTP correlation timer
      ansible.builtin.systemd:
        name: tlsgate-smtp-correlate.timer
        state: restarted
