---
# Copy to tlsgate.yml and adjust for your deployment. The real file is ignored.
# Mail login routes must reach a PROXY-aware listener so the mail server sees
# real client addresses (see docs/deployment.md, "Mail login backends"). These
# are Mailcow's in-container haproxy listeners; replace the documentation
# addresses with the Dovecot and Postfix container IPs.
routes:
  - listen: "[::]:993"
    backend: "192.0.2.250:10993"
    proxy_protocol: v2
  - listen: "[::]:465"
    backend: "192.0.2.253:10465"
    proxy_protocol: v2
  # Port 25 observation example:
  # - listen: "[::]:25"
  #   backend: "127.0.0.1:10025"
  #   protocol: smtp
  #   proxy_protocol: v2
  # Example: enroll HTTPS separately while mail remains strict.
  # - listen: "[::]:443"
  #   backend: "127.0.0.1:1443"
  #   allow_unknown: true
  #   proxy_protocol: v2
  #   max_concurrent: 256

# JA4 is stable across TLS extension reordering. Changing methods later requires
# reset_fingerprints: true for one deployment and re-enrollment of every client.
database: /var/lib/tlsgate/db.sqlite
fingerprint: ja4
reset_fingerprints: false
proxy_protocol: "off"
allow_unknown: false
drain_timeout: 1h
smtp_events: ""
smtp_instance: ""

# Bind metrics to loopback when a host-local Prometheus scrapes TLSGate.
metrics_listen: "127.0.0.1:9192"
tlsgate_configure_local_prometheus: true
tlsgate_prometheus_config: /etc/prometheus/prometheus.yml
max_concurrent_connections: 1024
connection_rate_per_ip: 1.0
connection_burst_per_ip: 120

max_fingerprints: 100000
notification_urls: []
notification_mode: failover
approve_ranges: []
alert_ranges: []
control_plane: {}

# Optional additional isolated processes on the same host. Each gets an
# independent connection budget, database, metrics endpoint, and Gatehub node.
tlsgate_extra_instances: []

# Optional report-only SMTP correlation collector. Enabling it installs the
# repository collector, hardened systemd units, and logrotate policy.
tlsgate_smtp_collector_enabled: false
tlsgate_smtp_collector_events: /var/lib/tlsgate/smtp-events.jsonl
tlsgate_smtp_collector_verdicts: /var/log/rspamd/tlsgate-verdicts.jsonl
tlsgate_smtp_collector_output: /var/lib/tlsgate/correlation
tlsgate_smtp_collector_instance: mx-public-smtp
tlsgate_smtp_collector_report_gatehub: false
tlsgate_smtp_collector_network_prefixes: ""
tlsgate_smtp_collector_calendar: "*:0/5"
tlsgate_smtp_collector_randomized_delay: 15s
tlsgate_smtp_collector_event_rotate_user: tlsgate
tlsgate_smtp_collector_event_rotate_group: tlsgate
tlsgate_smtp_collector_verdict_rotate_user: rspamd
tlsgate_smtp_collector_verdict_rotate_group: rspamd

# Optional: publish Gatehub trusted ranges to a file and keep Mailcow's fail2ban
# whitelist in step with them, so a trusted network whose address changes is
# never banned. Requires control_plane. See docs/mx-smtp.md.
trusted_ranges_file: ""
tlsgate_mailcow_f2b_sync_enabled: false
tlsgate_mailcow_f2b_sync_mailcow_dir: /opt/mailcow-dockerized
tlsgate_mailcow_f2b_sync_redis_container: mailcowdockerized-redis-mailcow-1
tlsgate_mailcow_f2b_sync_calendar: "*:0/5"

# Optionally install a reviewed Rspamd exporter. Loading/reloading it remains
# the MTA deployment's responsibility because that mechanism is site-specific.
tlsgate_smtp_rspamd_exporter_enabled: false
tlsgate_smtp_rspamd_exporter_source: rspamd-tlsgate.lua
tlsgate_smtp_rspamd_exporter_destination: /etc/rspamd/tlsgate.lua
tlsgate_smtp_rspamd_exporter_owner: root
tlsgate_smtp_rspamd_exporter_group: root
