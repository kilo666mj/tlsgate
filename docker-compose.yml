# Example deployment of tlsgate in front of a mail server (mailcow).
#
#   docker compose up -d
#
# Routes point at mailcow's in-container PROXY-aware listeners (Dovecot
# imaps_haproxy on 10993, Postfix smtps-haproxy on 10465) and send PROXY v2, so
# the mail server sees real client addresses. Do not route to mailcow's
# published loopback ports without PROXY protocol: every client would appear as
# the Docker gateway, which mailcow's Postfix trusts in mynetworks.
# The addresses below are mailcow's defaults (IPV4_NETWORK=172.22.1); check
# yours with `docker network inspect`. Dovecot must also trust the PROXY
# sender: add `haproxy_trusted_networks = 172.22.1.1` to
# data/conf/dovecot/extra.conf. See docs/deployment.md, "Mail login backends".
#
# host networking is used so the container network is reachable and tlsgate
# sees real client source IPs. It is Linux-only; for a bridge network see the
# commented alternative at the bottom.
services:
  tlsgate:
    # Pin to a digest in production, e.g. ghcr.io/kilo666mj/tlsgate@sha256:...
    image: ghcr.io/kilo666mj/tlsgate:latest@sha256:a27340aab502320fcf26de4644315e7b98c0ec03242e3cd741b3c5f5f439d8fd
    restart: unless-stopped
    network_mode: host
    command:
      - serve
      - --route=[::]:993=172.22.1.250:10993,proxy-protocol=v2
      - --route=[::]:465=172.22.1.253:10465,proxy-protocol=v2
      - --fingerprint=ja4
      # First-time setup: uncomment to record (not block) unknown clients while
      # you connect each device, then `tlsgate list` / `approve` and remove it.
      # - --allow-unknown
    volumes:
      # Persists the SQLite approval store and, if present, config.json for
      # blocked-range alerts (see the README).
      - tlsgate-data:/var/lib/tlsgate
    # Hardening: host networking widens blast radius, so strip everything the
    # proxy does not need. It only binds the privileged listen ports and writes
    # to its data volume.
    #
    # The image runs as UID 65532. NET_BIND_SERVICE is required because the
    # routes bind ports below 1024. For a host bind mount, chown the directory
    # to 65532:65532 and add :Z on SELinux hosts.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]

volumes:
  tlsgate-data:

# Bridge-network alternative (works on non-Linux, but the backend must be
# reachable from inside the container and client IPs are NATed to the docker
# gateway). tlsgate then fingerprints correctly but cannot pass real client
# addresses on, so avoid it for mail login routes (see the note at the top):
#
# services:
#   tlsgate:
#     image: ghcr.io/kilo666mj/tlsgate:latest
#     restart: unless-stopped
#     ports:
#       - "993:993"
#       - "465:465"
#     command:
#       - serve
#       - --route=[::]:993=host.docker.internal:10993
#       - --route=[::]:465=host.docker.internal:10465
#       - --fingerprint=ja4
#     volumes:
#       - tlsgate-data:/var/lib/tlsgate
#     read_only: true
#     tmpfs: ["/tmp"]
#     cap_drop: ["ALL"]
#     cap_add: ["NET_BIND_SERVICE"]
#     security_opt: ["no-new-privileges:true"]
